services:
  httpd_container:
    container_name: stats-web
    image: httpd:2.4
    ports:
      - 8080:80
    volumes:
      - ./frontend/:/opt/frontend
      - dataVolume:/usr/local/apache2/htdocs/data
      # Shared volume should only be used for data, which means separate subfolder which means refactor structure
    # Note: httpd-foreground below lets the web server keep running. Otherwise the container just exits
    command: sh -c "cp -r /opt/frontend/* /usr/local/apache2/htdocs &&
                    httpd-foreground"

  cron_container:
    container_name: data-collector
    image: alpine
    volumes:
      - dataVolume:/usr/local/apache2/htdocs/data # This shares the same volume 
      - ./data-collection:/opt/data-collection
      - ./data:/opt/data
    command: sh -c "chmod u+x /opt/data-collection/dataCollection.sh &&
                    cp /opt/data-collection/dataCollectionCron /etc/crontabs/root &&
                    cp -r /opt/data/* /usr/local/apache2/htdocs/data &&
                    /opt/data-collection/dataCollection.sh /usr/local/apache2/htdocs/data &&
                    crond -f"
volumes:
  dataVolume:
